  - id: attnsink-2025
    short: VAR
    title: "See What You Are Told: Visual Attention Sink in Large Multimodal Models"
    authors: Seil Kang, Jinyeong Kim, Junhyeok Kim, Seong Jae Hwang
    venue: ICLR 2025
    paper: https://arxiv.org/abs/2503.03321
    added: 2026-10-26
    motivation: LMM 总会把很高的注意力分给某些与文本无关的视觉 token；作者发现这些 token 源于隐藏状态中少数维度的巨大激活，类似语言模型中的 attention sink，称为“视觉注意力汇（visual attention sink）”，且去掉它们并不影响模型输出。
    method: 提出 Visual Attention Redistribution（VAR）：先找出天生关注图像的 image-centric heads，再把这些头里分给 sink token 的注意力“回收”为预算，按比例重新分配给其他视觉 token；无需训练、额外模型或额外推理步骤。
    result: 在通用视觉语言任务、视觉幻觉任务和以视觉为中心的任务上，多个 LMM 都获得一致提升。
    figures:
      - file: fig1.png
        caption: Figure 1
        type: teaser
        comment: 用“Is there a □ in the image?”模板串起四组例子，紫色注意力块叠加在图像上，红框标出无关却高注意力的 sink token，一眼看出现象。
      - file: fig2.png
        caption: Figure 2
        type: framework
        comment: 左侧 LMM 结构示意（token 小方块 + 多头注意力），中间注意力图，右侧三张隐藏状态维度柱状图；红 / 蓝 / 星标分别对应无关、相关和 sink token，颜色贯穿全图。
      - file: fig3.png
        caption: Figure 3
        type: plot
        comment: (a) 散点密度图 + (b)(c) 简洁柱状对比 + (d) 有无 sink 的可视化，四个面板从统计到案例层层递进。
      - file: fig4.png
        caption: Figure 4
        type: visualization
        comment: 表格式排版的注意力可视化：两行例子 × 高 / 低 non-sink 比例的注意力头，表头用蓝 / 红底色区分两组。
      - file: fig5.png
        caption: Figure 5
        type: framework
        comment: VAR 方法示意：(a) 用圆圈 / 叉号筛选 image-centric heads，(b) 把 sink 注意力汇入“Attention Budget”桶再分配，蓝 / 红箭头表示权重增减，比喻直观。
      - file: fig6.png
        caption: Figure 6
        type: visualization
        comment: 一行三联图：问题、LLaVA 回答、加 VAR 后回答，红 / 蓝高亮关键词，注意力块叠加在 logo 上。

  - id: vgr-2026
    short: VGR
    title: "When Diffusion Language Models Hesitate: Detecting and Correcting Visual Hallucinations via Confidence Fluctuation"
    authors: Wenzheng Song, Pei Chen, Yichen Tan, Zejian Li, Lingyun Sun
    venue: ICML 2026
    paper: https://openreview.net/forum?id=1knvdLwxQq
    code: https://github.com/SongWZ3214/VGR
    added: 2026-10-26
    motivation: 多模态扩散语言模型（MDLM）不像自回归模型那样逐步与视觉内容交互，只依赖初始化时编码好的静态视觉特征，去噪过程容易滑向语言先验、产生视觉幻觉；同时作者发现幻觉 token 在去噪过程中的置信度会明显“犹豫”（反复波动），而正确 token 平稳上升。
    method: 提出 VGR（Visual-Guided Refinement）：用去噪轨迹上的置信度波动（CF）定位不确定片段，经句法分析锚定到语义核心词；再用 Grounding DINO 找到并裁剪对应图像区域，对该片段原位重新 mask，并在全局图 + 局部裁剪的双视角条件下重新生成；训练阶段构建 VGR-Instruct 数据集做双视角感知微调。
    result: 在图像描述和幻觉评测基准上减少幻觉，同时召回更多细节。
    figures:
      - file: fig1.png
        caption: Figure 1
        type: teaser
        comment: 上下两段文本框对比 LLaDA-V 与 VGR 的描述，红字 + ✗ 标幻觉、蓝字 + ✓ 标修正结果；左侧全局图到局部裁剪用红色虚线框和编号连接，红 / 蓝箭头表示“初始生成 → 修正”。
      - file: fig2.png
        caption: Figure 2
        type: plot
        comment: (a)(b) 置信度轨迹用红色虚线框圈出波动段，对比正常 token 与幻觉 token；(c)(d) 半透明叠加的密度直方图对比三类 token 的分布，从案例到统计一气呵成。
      - file: fig3.png
        caption: Figure 3
        type: plot
        comment: 两个蓝色系饼图对比高 CF token 与低置信度 token 的词性分布，单色渐变 + 外部引线标注小扇区，干净克制。
      - file: fig4.png
        caption: Figure 4
        type: framework
        comment: 左右分为训练（双视角感知训练）与推理（三阶段修正循环），浅蓝底分区 + 绿色模块块，🔥 / ❄️ 标出可训练与冻结模块，M 方块直观表示 mask token，三个 Stage 用标题框串成闭环。

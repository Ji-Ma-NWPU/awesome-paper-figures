# 论文与图片的唯一数据源。修改后运行 `python3 scripts/build_readme.py` 重新生成 README、论文页和画廊页。
#
# 图类型（type）可选值：
#   teaser        Teaser / Figure 1
#   framework     方法框架图 / Pipeline
#   concept       概念示意图 / Motivation
#   plot          实验结果图（曲线、柱状图等）
#   visualization 可视化 / 定性结果（注意力图、案例等）
#   table         表格
#
# 条目示例：
# - id: llava-2023                      # 唯一标识，也是 figures/ 下的子目录名
#   short: LLaVA                       # 可选，画廊里显示的简称
#   title: Visual Instruction Tuning
#   authors: Haotian Liu, Chunyuan Li, Qingyang Wu, Yong Jae Lee
#   venue: NeurIPS 2023
#   paper: https://arxiv.org/abs/2304.08485
#   code: https://github.com/haotian-liu/LLaVA   # 可选
#   added: 2026-10-26
#   motivation: ...                   # 可选，TL;DR：动机 / 方法 / 效果
#   method: ...
#   result: ...
#   figures:
#     - file: fig1.png                  # 位于 figures/llava-2023/fig1.png；暂无截图时省略
#       caption: Figure 1
#       type: framework
#       comment: 布局简洁，数据流方向清晰，配色克制。

papers:
  - id: realvr-2026
    short: ReaLVR
    title: "Rethinking Latent Visual Reasoning: Grounding Latent Reasoning in Visual Evidence"
    authors: Xi Xiao, Tianchen Zhao, Youngeun Kim, et al.
    venue: Preprint 2026
    paper: https://arxiv.org/abs/2609.34563
    added: 2026-10-26
    motivation: 隐式视觉推理（LVR）中的 latent token 对“会改变正确答案的图像扰动”几乎不敏感（latent evidence-credit gap）：GRPO 只奖励最终答案，没有告诉 latent token 该保留什么视觉证据、哪些位置需要更强监督。
    method: 提出 ReaLVR，直接在模型自己生成的 latent 轨迹上加视觉证据监督：对比正确答案与模型采样出的错误答案对各 latent token 的注意力，决定“在哪里”加强监督；对比相关与不匹配的视觉证据，决定“保留什么”。只在训练时使用，不改模型结构和推理流程。
    result: Qwen2.5-VL-7B 上五项任务平均 63.7%，优于已有 LVR 方法；首次把隐式视觉推理训练扩展到 235B 规模。
    figures:
      - file: fig1.png
        caption: Figure 1
        type: teaser
        comment: 三栏 (a) 真实案例 + 红框放大细节、(b) LVR / ReaLVR 两行流程对比、(c) 横向条形量化证据，一张图讲完动机、方法与结论；蓝 / 粉两色分别对应 what / where，配色与正文呼应。
      - file: fig3.png
        caption: Figure 3
        type: visualization
        comment: 两张注意力矩阵并排，用彩色括号标出 Visual / Question / Latent / Answer 分区，框线 + 箭头注释直接点出“弱读出 vs 强读出”，红蓝发散色标配合灰色因果掩码，信息密度高但不乱。

  - id: mob-2025
    short: MoB
    title: "Why 1 + 1 < 1 in Visual Token Pruning: Beyond Naïve Integration via Multi-Objective Balanced Covering"
    authors: Yangfu Li, Hongjian Zhan, Tianyi Chen, Qi Liu, Yu-jie Xiong, Yue Lu
    venue: NeurIPS 2025
    paper: https://arxiv.org/abs/2505.10118
    code: https://github.com/YChenL/MoB
    added: 2026-10-26
    motivation: 视觉 token 剪枝有两个目标：视觉保留（VP）和提示对齐（PA）。现有多目标方法用固定策略把两者揉在一起，结果并不比单目标方法好（1+1<1），原因是两个目标的相对重要性会随 prompt 与图像的耦合程度变化。
    method: 基于 Hausdorff 距离推导出剪枝的首个闭式误差界，再用 ε-covering 理论刻画两个目标之间的权衡；据此提出免训练的 MoB，把剪枝重构为双目标覆盖问题，用贪心的“半径交换”把权衡转化为预算分配，复杂度随 token 数线性增长。
    result: LLaVA-1.5-7B 只保留 11.1% 视觉 token 仍保持 96.4% 性能；LLaVA-Next-7B 加速 1.3–1.5×，性能几乎无损；可直接用于 Qwen2-VL 和 Video-LLaVA。
    figures:
      - file: fig1.png
        caption: Figure 1
        type: teaser
        comment: (a) 正负双向柱状图 + 浅色背景分区标注好坏，(b) 绿 / 蓝两组密度直方图区分强弱耦合，(c) 三个预算下的雷达图并在每个轴上标注紫色相对提升，层层递进地支撑“1+1<1”的论点。

  - id: deepscan-2026
    short: DeepScan
    title: "DeepScan: A Training-Free Framework for Visually Grounded Reasoning in Large Vision-Language Models"
    authors: Yangfu Li, Hongjian Zhan, Jiawei Chen, Yuning Gong, Qi Liu, Yue Lu
    venue: CVPR 2026
    paper: https://arxiv.org/abs/2603.03857
    added: 2026-10-26
    motivation: 现有 visually grounded reasoning 方法大多是自上而下的 coarse-to-fine：先在整张图上一次性框出完整证据区域再细化，容易被嘈杂背景（attention sink）和外观相似的物体（attention drift）带偏。
    method: 提出免训练框架 DeepScan，模仿人“先找局部线索、再还原整体”的方式：Hierarchical Scanning 先在图像块上探索局部线索并多尺度提取证据，自下而上恢复目标；Refocusing 让 LVLM 与视觉专家协作调整证据视野；Evidence-Enhanced Reasoning 用混合证据记忆提供多粒度视图来作答。
    result: Qwen2.5-VL-7B 在 V* 上达到 90.6%（+16.3%），无需训练即可迁移到不同架构，并扩展到 72B 模型。
    figures:
      - file: fig1.png
        caption: Figure 1
        type: concept
        comment: 用同一张卡通海狸示例左右对比 coarse-to-fine 与 bottom-up 两条 pipeline，失败分支半透明淡化、✗ / ✓ 图标标出成败，手绘风插图比真实图片更干净易懂。
      - file: fig2.png
        caption: Figure 2
        type: plot
        comment: 柱状图用深紫 / 浅紫 / 浅蓝区分 training-free / training-based / 通用模型，本方法加粗黑框突出，虚线箭头与灰色斜体注释说明“可扩展”和基座分组。

  - id: pflownet-2026
    short: PFlowNet
    title: Perceptual Flow Network for Visually Grounded Reasoning
    authors: Yangfu Li, Yuning Gong, Hongjian Zhan, Teng Li, Yuanhuiyi Lyu, et al.
    venue: ICML 2026
    paper: https://arxiv.org/abs/2605.02730
    added: 2026-10-26
    motivation: 现有方法用视觉专家（如 GroundingDINO）的几何先验作为强化学习奖励来约束推理轨迹，但预实验发现：专家标注偏向几何精度，对推理并非最优——框得最准的证据不一定最有助于答对题。
    method: 提出 PFlowNet，把感知与推理解耦：模型先生成结构化的 perceptual flow（规划状态 + 一串 RoI 及其描述），再以此为条件作答；用变分强化学习结合多维奖励（质量 / 效能 / 几何）与邻域几何塑形，在专家先验附近探索更有利于推理的感知行为，并给出理论性能保证。
    result: 基于 Qwen3-VL-8B，在 V* Bench（90.6%）和 MME-RealWorld-lite（67.0%）上刷新 SOTA，推理延迟和上下文长度也低于 agentic 方法。
    figures:
      - file: fig1.png
        caption: Figure 1
        type: teaser
        comment: 左侧用“原图 → 黄金证据 → 扩展 → 专家标注”的递进裁剪示意精度并非越高越好，右侧两条折线配置信带给出量化证据；绿 ✓ / 红 ✗ 角标与金色 Golden Priors 高亮串联图文。
      - file: fig2.png
        caption: Figure 2
        type: concept
        comment: 把隐空间画成一张 3D 曲面，对比“被专家轨迹拉偏 (Biased)”与“在邻域内向最优输出靠拢 (Closer)”，金色 / 紫色轨迹 + 力的箭头把抽象优化目标变成直观的几何图景。
      - file: fig3.png
        caption: Figure 3
        type: framework
        comment: 整体框架图：底部编码器 → 中部 Perceptual Flow Network 长条渐变 → 顶部 Reward Model，右上角用花括号拆解多维奖励公式；token 用小色块编码并配完整图例，实线 / 虚线区分训练与推理。
      - file: fig4.png
        caption: Figure 4
        type: framework
        comment: 数据合成流水线：Random Expand → Annotation → VLMs Verify 三层渐变条带堆叠，右侧竖排图例与左侧流程一一对应，紫 / 蓝色块延续全文的 token 配色。
      - file: fig5.png
        caption: Figure 5
        type: plot
        comment: 环形图 + 堆叠柱状图 + 双 y 轴折线的组合，同一组紫色深浅表示 RoI 数量，柱顶标数值，信息完整且配色统一。
      - file: fig6.png
        caption: Figure 6
        type: plot
        comment: 共享横轴的上下镜像柱状图：上方是分数，下方是延迟和上下文长度，“下方面积越小代价越低”的读法一目了然；各方法用 logo 图标代替图例。
      - file: fig7.png
        caption: Figure 7
        type: plot
        comment: 四个小多图并排的 Pass@k 曲线，统一图例放在底部，灰 / 浅紫 / 深紫三色对比清晰，简洁克制。
      - file: fig8.png
        caption: Figure 8
        type: visualization
        comment: 定性对比：左侧原图上用白色弧形箭头画出感知路径，右侧三个浅色文本框分别展示各方法推理过程，红字标错、下划线标关键句，PFlowNet 用虚线框 + 渐变底色突出。
      - file: fig9.png
        caption: Figure 9
        type: plot
        comment: 在 Fig 5 的样式基础上加入 after RFT 黑框柱和红色虚线箭头标注下降百分比，直观展示 RFT 前后输出长度的变化。
      - file: fig10.png
        caption: Figure 10
        type: plot
        comment: 2×4 训练曲线网格：上排对比不同正则方案，下排扫描 ε 与 λ，分别用紫色与蓝色渐变表示超参从小到大，色彩即图例。
      - file: fig11.png
        caption: Figure 11
        type: concept
        comment: 三种范式对比：(a) Agentic、(b) Grounded RLVR、(c) PFlowNet，每行都是“输入 → VLM → 推理过程 → 结论”，右侧用 ⚠️ / 💡 卡片总结优缺点，底部统一图例，排版整齐。

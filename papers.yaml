  - id: memvr-2025
    short: MemVR
    title: "Look Twice Before You Answer: Memory-Space Visual Retracing for Hallucination Mitigation in Multimodal Large Language Models"
    authors: Xin Zou, Yizhou Wang, Yibo Yan, Yuanhuiyi Lyu, Kening Zheng, et al.
    venue: ICML 2025
    paper: https://arxiv.org/abs/2410.03577
    code: https://github.com/1zhou-Wang/MemVR
    added: 2026-10-26
    motivation: MLLM 的幻觉常源于文本解码器在生成过程中逐渐“遗忘”视觉信息；VCD 等对比解码方法需要多次前向，推理慢且会损伤通用能力。
    method: 提出 MemVR，模仿人“记不清就再看一眼”：推理时监测各层的不确定性，当不确定性过高时，在中间触发层把视觉 token 作为 key-value 记忆经 FFN 重新注入（look-twice），不改模型、不需训练。
    result: 在 POPE、CHAIR、HallusionBench 等幻觉基准上显著降低幻觉，同时在 MME、MM-Vet 等通用基准上也有提升，推理开销与贪心解码几乎相同。
    figures:
      - file: fig1.png
        caption: Figure 1
        type: teaser
        comment: 左右对比 VCD 与 MemVR 两种范式：层堆叠示意 + 小柱状图表示输出分布，底部用“乌龟 / 飞机”图标对比推理速度，一眼看出差异。
      - file: fig2.png
        caption: Figure 2
        type: plot
        comment: 两张雷达图分别展示多基准总分与 MME 子项，MemVR 用最外圈绿色粗线包住其他方法，轴上直接标数值。
      - file: fig3.png
        caption: Figure 3
        type: visualization
        comment: 原图 + 逐 token × 逐层不确定性热力图，用圆角框圈出高不确定性的 token，绿色单色渐变干净统一。
      - file: fig4.png
        caption: Figure 4
        type: plot
        comment: 折线 + 柱状两个小图并排，实线 / 虚线区分 text / image 特征缩放，配色与图例简洁。
      - file: fig5.png

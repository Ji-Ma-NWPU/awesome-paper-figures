  - id: holov-2025
    short: HoloV
    title: "Don't Just Chase \"Highlighted Tokens\" in MLLMs: Revisiting Visual Holistic Context Retention"
    authors: Xin Zou, Di Lu, Yizhou Wang, Yibo Yan, Yuanhuiyi Lyu, et al.
    venue: NeurIPS 2025
    paper: https://arxiv.org/abs/2510.02912
    code: https://github.com/obananas/HoloV
    added: 2026-10-26
    motivation: 现有视觉 token 剪枝多是“注意力优先”（按文本-视觉交叉注意力或 [CLS] 注意力保留高亮 token），但这些 token 往往语义相似、扎堆在少数区域，高剪枝率下性能断崖式下降。
    method: 提出即插即用的 HoloV，从整体上下文角度重新考虑保留哪些 token：把图像划分为多个空间 crop，在 crop 之间自适应分配剪枝预算，并在 crop 内外重排高亮 token，使保留的 token 覆盖全局视觉上下文而不是只盯着显著区域。
    result: LLaVA-1.5 剪掉 88.9% 视觉 token 后仍保留 95.8% 性能；在多种 MLLM（LLaVA-NeXT、Qwen2.5-VL、视频模型）和剪枝率下优于 SOTA。
    figures:
      - file: fig1.png
        caption: Figure 1
        type: teaser
        comment: 上下两行对比 FastV 与 HoloV 的剪枝流程，右侧直接展示保留下来的 token 和回答结果（Oishi ✗ vs Lay's ✓），带表情图标，生动直观。
      - file: fig2.png
        caption: Figure 2
        type: plot
        comment: 四个小折线图展示性能随剪枝率变化，HoloV 绿线在高剪枝率下明显更稳，图例统一。
      - file: fig3.png
        caption: Figure 3
        type: visualization
        comment: 左侧把图像块连线到对应语义词，右侧按 75% → 12.5% 逐步展示保留的 token，暗化被剪掉的区域，渐进式排版很直观。
      - file: fig4.png
        caption: Figure 4
        type: visualization
        comment: 注意力热力图与保留 token 可视化并排，FastV 扎堆、HoloV 分散的对比一目了然。
      - file: fig5.png
        caption: Figure 5
        type: plot
        comment: 累积分布曲线小图，说明 [CLS] 注意力高度集中，嵌在正文旁节省版面。
      - file: fig6.png

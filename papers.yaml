# 论文与图片的唯一数据源。修改后运行 `python3 scripts/build_readme.py` 重新生成 README.md。
#
# 图类型（type）可选值：
#   teaser        Teaser / Figure 1
#   framework     方法框架图 / Pipeline
#   concept       概念示意图 / Motivation
#   plot          实验结果图（曲线、柱状图等）
#   visualization 可视化 / 定性结果（注意力图、案例等）
#   table         表格
#
# 条目示例：
# - id: llava-2023                      # 唯一标识，也是 figures/ 下的子目录名
#   title: Visual Instruction Tuning
#   authors: Haotian Liu, Chunyuan Li, Qingyang Wu, Yong Jae Lee
#   venue: NeurIPS 2023
#   paper: https://arxiv.org/abs/2304.08485
#   code: https://github.com/haotian-liu/LLaVA   # 可选
#   added: 2026-10-26
#   figures:
#     - file: fig1.png                  # 位于 figures/llava-2023/fig1.png；暂无截图时省略
#       caption: Figure 1
#       type: framework
#       comment: 布局简洁，数据流方向清晰，配色克制。

papers:
  - id: realvr-2026
    title: "Rethinking Latent Visual Reasoning: Grounding Latent Reasoning in Visual Evidence"
    authors: Xi Xiao, Tianchen Zhao, Youngeun Kim, et al.
    venue: Preprint 2026
    paper: https://arxiv.org/abs/2609.34563
    added: 2026-10-26
    figures:
      - file: fig1.png
        caption: Figure 1
        type: teaser
        comment: 三栏 (a) 真实案例 + 红框放大细节、(b) LVR / ReaLVR 两行流程对比、(c) 横向条形量化证据，一张图讲完动机、方法与结论；蓝 / 粉两色分别对应 what / where，配色与正文呼应。
      - file: fig3.png
        caption: Figure 3
        type: visualization
        comment: 两张注意力矩阵并排，用彩色括号标出 Visual / Question / Latent / Answer 分区，框线 + 箭头注释直接点出“弱读出 vs 强读出”，红蓝发散色标配合灰色因果掩码，信息密度高但不乱。

  - id: mob-2025
    title: "Why 1 + 1 < 1 in Visual Token Pruning: Beyond Naïve Integration via Multi-Objective Balanced Covering"
    authors: Yangfu Li, Hongjian Zhan, Tianyi Chen, Qi Liu, Yu-jie Xiong, Yue Lu
    venue: NeurIPS 2025
    paper: https://arxiv.org/abs/2505.10118
    code: https://github.com/YChenL/MoB
    added: 2026-10-26
    figures:
      - file: fig1.png
        caption: Figure 1
        type: teaser
        comment: (a) 正负双向柱状图 + 浅色背景分区标注好坏，(b) 绿 / 蓝两组密度直方图区分强弱耦合，(c) 三个预算下的雷达图并在每个轴上标注紫色相对提升，层层递进地支撑“1+1<1”的论点。

  - id: deepscan-2026
    title: "DeepScan: A Training-Free Framework for Visually Grounded Reasoning in Large Vision-Language Models"
    authors: Yangfu Li, Hongjian Zhan, Jiawei Chen, Yuning Gong, Qi Liu, Yue Lu
    venue: CVPR 2026
    paper: https://arxiv.org/abs/2603.03857
    added: 2026-10-26
    figures:
      - file: fig1.png
        caption: Figure 1
        type: concept
        comment: 用同一张卡通海狸示例左右对比 coarse-to-fine 与 bottom-up 两条 pipeline，失败分支半透明淡化、✗ / ✓ 图标标出成败，手绘风插图比真实图片更干净易懂。
      - file: fig2.png
        caption: Figure 2
        type: plot
        comment: 柱状图用深紫 / 浅紫 / 浅蓝区分 training-free / training-based / 通用模型，本方法加粗黑框突出，虚线箭头与灰色斜体注释说明“可扩展”和基座分组。

  - id: pflownet-2026
    title: Perceptual Flow Network for Visually Grounded Reasoning
    authors: Yangfu Li, Yuning Gong, Hongjian Zhan, Teng Li, Yuanhuiyi Lyu, et al.
    venue: ICML 2026
    paper: https://arxiv.org/abs/2605.02730
    added: 2026-10-26
    figures:
      - file: fig2.png
        caption: Figure 2
        type: concept
        comment: 把隐空间画成一张 3D 曲面，对比“被专家轨迹拉偏 (Biased)”与“在邻域内向最优输出靠拢 (Closer)”，金色 / 紫色轨迹 + 力的箭头把抽象优化目标变成直观的几何图景。
      - file: fig6.png
        caption: Figure 6
        type: plot
        comment: 共享横轴的上下镜像柱状图：上方是分数，下方是延迟和上下文长度，“下方面积越小代价越低”的读法一目了然；各方法用 logo 图标代替图例。
